services:
  database:
    image: mysql:8.0
    container_name: city_lunch_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: city_lunch
      MYSQL_USER: city_lunch_user
      MYSQL_PASSWORD: city_lunch_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7
    container_name: city_lunch_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"

volumes:
  mysql_data:
  mongo_data:
